[package]
name = "lazygitrs"
version = "0.2.0"
edition = "2024"
# Floor set by dependencies (ordered-float, tree-sitter-language: 1.90);
# verified with `cargo +1.90 check --locked`.
rust-version = "1.90"
description = "A faster, memory-safe, more ergonomic slopfork of lazygit"
repository = "https://github.com/blankeos/lazygitrs"
homepage = "https://github.com/blankeos/lazygitrs"
license = "MIT"

[features]
default = ["syntax-highlight"]
# Tree-sitter grammars for diff syntax colouring. They are most of the
# binary's data section; `--no-default-features` builds a much smaller binary
# that renders diffs uncoloured.
syntax-highlight = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-css",
    "dep:tree-sitter-html",
    "dep:tree-sitter-md",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `use-dev-tty` switches crossterm off mio/kqueue onto filedescriptor's
# select()-based reader. Required on macOS under Helix `:insert-output`,
# where stdin is /dev/null so events come from /dev/tty (mio returns POLLNVAL).
crossterm = { version = "0.29", features = ["event-stream", "libc", "use-dev-tty"] }
dirs = "6"
ratatui = "0.30"
ratatui-image = { version = "=11.1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1", features = ["derive"] }
# `serde_yaml` is deprecated (unmaintained `unsafe-libyaml`, RUSTSEC-2024-0449);
# serde_norway is the maintained drop-in fork (on unsafe-libyaml-norway),
# renamed so call sites are unchanged.
serde_yaml = { package = "serde_norway", version = "0.9" }
serde_json = "1"
toml = "0.8"
thiserror = "2"
# Only the ACP server (acp.rs) uses tokio: a current-thread runtime, a TCP
# listener and a broadcast channel. "time" backs axum's SSE keep-alive.
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
include_dir = "0.7"
similar = { version = "2", features = ["unicode"] }
tree-sitter = { version = "0.24", optional = true }
tree-sitter-highlight = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-md = { version = "0.3", optional = true }
unicode-width = "0.2"
ratatui-textarea = "0.9"
textwrap = "0.16.2"
axum = "0.8.9"
futures-util = "0.3"
async-stream = "0.3"
libc = "0.2"
strip-ansi-escapes = "0.2"

# Lint policy (see _docs/AUDIT-2026-11.md, P2-2). These are structural style
# lints whose fixes belong to the Phase 5 refactor (Gui god-object, render fns
# with many params), not to drive-by edits of upstream-owned code.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
needless_range_loop = "allow"
field_reassign_with_default = "allow"
# Spelled-out case lists read better than the "simplified" form.
nonminimal_bool = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
